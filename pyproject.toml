[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-coding-agent"
version = "0.1.0"
description = "A small LangGraph agent that generates Python scripts and validates them before returning results."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain==1.3.0",
    "langchain-openai==1.2.1",
    "langgraph==1.2.4",
    "python-dotenv==1.2.2",
    "tiktoken==0.13.0",
]

[project.scripts]
coding-agent = "coding_agent:main"

[project.optional-dependencies]
dev = [
    "black==26.5.1",
]

[tool.setuptools]
py-modules = ["coding_agent"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
